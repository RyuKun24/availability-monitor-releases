name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION=$tag"
          Write-Host "Version: $tag"
        shell: powershell
      
      - name: Verify version sync
        run: |
          # Read version from pyproject.toml using regex
          $content = Get-Content pyproject.toml -Raw
          if ($content -match 'version\s*=\s*"([^"]+)"') {
            $pyVersion = $matches[1]
          } else {
            Write-Error "Could not find version in pyproject.toml"
            exit 1
          }
          
          # Read version from package.json
          $package = Get-Content electron/package.json | ConvertFrom-Json
          $nodeVersion = $package.version
          
          $expectedVersion = "${{ steps.version.outputs.VERSION }}".Replace("v", "")
          
          Write-Host "Versions found:"
          Write-Host "  pyproject.toml: $pyVersion"
          Write-Host "  package.json: $nodeVersion"
          Write-Host "  Expected (from tag): $expectedVersion"
          
          if ($pyVersion -ne $expectedVersion -or $nodeVersion -ne $expectedVersion) {
            Write-Error "Version mismatch!"
            exit 1
          }
          
          Write-Host "[OK] Versions are in sync: $expectedVersion"
        shell: powershell
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller toml
          python -m playwright install chromium
      
      - name: Build Python executable
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python launcher/build_exe.py
        working-directory: ${{ github.workspace }}
      
      - name: Install Node dependencies
        run: |
          npm ci
        working-directory: electron
      
      - name: Build Electron app
        run: |
          npm run build:installer
        working-directory: electron
      
      - name: List build artifacts
        run: |
          Write-Host "=== Python Build Output ==="
          Get-ChildItem dist/ -Recurse
          
          Write-Host "`n=== Electron Build Output ==="
          Get-ChildItem electron/dist/ -Recurse
        shell: powershell
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/availability_monitor.exe
            electron/dist/Availability Monitor Setup *.exe
            electron/dist/Availability Monitor-*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          draft: false
          prerelease: false
          body: |
            # Release ${{ steps.version.outputs.VERSION }}
            
            ## Files
            - `availability_monitor.exe` - Python backend (compiled)
            - `Availability Monitor Setup *.exe` - Installer
            - `Availability Monitor-*.exe` - Portable executable
            
            ## Installation
            1. Download the installer or portable version
            2. Run the installer or executable
            3. Configure Telegram settings on first run
            4. Click "Start" to begin monitoring
            
            ## Changes
            See commit history for details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
